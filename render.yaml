services:
  - type: web
    name: assistente-caneta-backend
    runtime: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      # SEGURANÇA: origens explícitas. Apps mobile (Flutter) não enviam
      # header Origin e continuam funcionando. Web (Vercel + custom
      # domain) precisa estar listada aqui.
      - key: CORS_ORIGIN
        value: "https://www.recorpo.com.br,https://recorpo.com.br,https://recorpo-web.vercel.app"
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
    # Produção roda no plano Starter pago (não desliga por inatividade →
    # sem cold start). Mantemos aqui pra que um sync futuro do blueprint
    # NÃO rebaixe o serviço pra free acidentalmente. Ver histórico: o
    # serviço free antigo (assistente-caneta-backend) foi suspenso em
    # 2026-07-31; a produção é assistente-caneta-backend-tkl7.
    plan: starter
    region: ohio
    healthCheckPath: /health
