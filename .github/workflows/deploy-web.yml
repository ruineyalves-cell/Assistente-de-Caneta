name: Deploy Site (Vercel) — Backup Manual

# Este workflow é FALLBACK. O caminho normal é Vercel Git Integration
# conectado ao repo (dashboard.vercel.com → project → Settings → Git),
# que deploya automaticamente a cada push em `main` sem passar por aqui.
#
# Ative este workflow manualmente (Actions → Deploy Site → Run workflow)
# apenas se:
#   - Vercel Git Integration estiver desconectado ou com problema
#   - Precisar forçar um redeploy sem novo commit
#
# Requer secrets no repo (Settings → Secrets and variables → Actions):
#   - VERCEL_TOKEN     (dashboard Vercel → Account → Tokens)
#   - VERCEL_ORG_ID    (project Vercel → Settings → General)
#   - VERCEL_PROJECT_ID
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel env
        working-directory: ./web
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build
        working-directory: ./web
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy prebuilt to production
        working-directory: ./web
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
